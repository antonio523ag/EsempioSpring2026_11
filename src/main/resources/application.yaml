server:
  port: 8088

spring:
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/edifici?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: toor
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  profiles:
    active:
      - dev
custom:
  key:
    jwt: chiaveAbbastanzaLungaDaCodificareUnTokenJWTInManieraSicuraENonViolabile
management:
  server:
    port: 8081
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include:
          - metrics
          - info
          - threaddump
          - health
          - custom
      base-path: /metriche
      path-mapping:
        health: /stato